<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
    <title>SALTIX</title>
    <style>
        :root {
            color-scheme: light;
            --border: #c8ccd2;
            --text: #1f2933;
            --muted: #5f6b7a;
            --surface: #f4f6f8;
            --tab-bg: #e5e9ef;
            --tab-active: #ffffff;
            --accent: #2f7d32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text);
            overflow: hidden;
        }

        .toolbar {
            background-color: var(--surface);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
        }

        .toolbar button {
            min-height: 28px;
            padding: 4px 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #ffffff;
            color: var(--text);
        }

        .toolbar button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .toolbar-separator {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 2px;
        }

        .status-text {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 12px;
        }

        .tab-strip {
            display: flex;
            align-items: end;
            min-height: 36px;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            align-items: end;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 1;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 240px;
            min-width: 120px;
            height: 34px;
            padding: 0 8px 0 12px;
            border: 0;
            border-right: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }

        .tab.active {
            background: var(--tab-active);
        }

        .tab.main-mail-tab {
            background: #5b8f22;
            color: #ffffff;
            border-right-color: #47711b;
        }

        .tab.main-mail-tab.active {
            background: #5b8f22;
            color: #ffffff;
        }

        .tab.main-mail-tab.loading .tab-title::before {
            color: #e6f1dc;
        }

        .tab-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            text-align: left;
            font-size: 13px;
        }

        .tab.loading .tab-title::before {
            content: "Loading ";
            color: var(--muted);
        }

        .tab-close {
            display: inline-grid;
            place-items: center;
            width: 20px;
            height: 20px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
        }

        .tab-close:hover {
            background: #d9dde3;
            color: var(--text);
        }

        .tab.main-mail-tab .tab-close {
            display: none;
        }

        .new-tab {
            width: 36px;
            height: 34px;
            border: 0;
            border-left: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .webviews {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #ffffff;
        }

        .tab-webview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .tab-webview.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="go-back" disabled>Back</button>
        <button id="go-forward" disabled>Forward</button>
        <button id="reload-tab">Reload</button>
        <button id="open-active-external">Open in Browser</button>
        <span id="active-url" class="status-text"></span>
    </div>
    <div class="tab-strip">
        <div id="tabs" class="tabs"></div>
        <button id="new-tab" class="new-tab" title="New SAPO Mail tab">+</button>
    </div>
    <div id="webviews" class="webviews"></div>
    <script src="renderer.js"></script>
</body>
</html>
