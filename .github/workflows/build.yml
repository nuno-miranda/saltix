name: Build and Release

# Trigger only on semantic version tags like v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # Needed to publish releases and upload release assets
  packages: write   # Optional if you later publish packages

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the Electron app using electron-builder.
      # Windows runner produces a .exe via NSIS.
      - name: Package application on Windows
        if: matrix.os == 'windows-latest'
        run: npm run build -- --win nsis

      - name: Package application on Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build -- --linux AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: saltix-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: saltix-windows-latest
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: saltix-ubuntu-latest
          path: artifacts/linux

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }} for SALTIX.
            Built using GitHub Actions on Windows and Linux.
          draft: false
          prerelease: false

      - name: Find release assets
        id: find_assets
        run: |
          set -e
          echo "Windows files:"
          find artifacts/windows -maxdepth 2 -type f -name '*.exe' -print
          echo "Linux files:"
          find artifacts/linux -maxdepth 2 -type f -name '*.AppImage' -print
          windows_asset=$(find artifacts/windows -maxdepth 2 -type f -name '*.exe' | head -n1)
          linux_asset=$(find artifacts/linux -maxdepth 2 -type f -name '*.AppImage' | head -n1)
          if [ -n "$windows_asset" ]; then
            echo "windows_asset=$windows_asset" >> $GITHUB_OUTPUT
          fi
          if [ -n "$linux_asset" ]; then
            echo "linux_asset=$linux_asset" >> $GITHUB_OUTPUT
          fi

      - name: Upload Windows release asset
        if: steps.find_assets.outputs.windows_asset != ''
        uses: softprops/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.windows_asset }}
          asset_name: saltix-${{ github.ref_name }}-windows.exe
          asset_content_type: application/x-msdownload

      - name: Upload Linux release asset
        if: steps.find_assets.outputs.linux_asset != ''
        uses: softprops/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.linux_asset }}
          asset_name: saltix-${{ github.ref_name }}-linux.AppImage
          asset_content_type: application/octet-stream
