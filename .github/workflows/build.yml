name: Build and Release

# Trigger only on semantic version tags like v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build Windows installer (.exe)
      - name: Package application on Windows
        if: matrix.os == 'windows-latest'
        run: npm run build -- --win nsis

      # Build Linux AppImage and .deb
      - name: Package application on Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build -- --linux

      - name: Ensure AppImage is executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x dist/*.AppImage

      # Upload Windows artifacts
      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: saltix-windows
          path: dist/*.exe

      # Upload Linux artifacts
      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: saltix-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: saltix-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: saltix-linux
          path: artifacts/linux

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SALTIX ${{ github.ref_name }}
          body: |
            Automated release for SALTIX.

            Includes:
            - Windows installer (.exe)
            - Linux AppImage
            - Linux .deb package

          files: |
            artifacts/windows/**/*.exe
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}