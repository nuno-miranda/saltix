<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPO Mail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background-color: #f0f0f0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toolbar button {
            padding: 5px 10px;
            cursor: pointer;
        }
        .notifications-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: green;
        }
        .notifications-indicator.disabled {
            background-color: red;
        }
        webview {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="new-session">New Session</button>
        <button id="toggle-notifications">Notifications ON/OFF</button>
        <div id="notifications-indicator" class="notifications-indicator"></div>
    </div>
    <webview id="mail-webview" src="https://mail.sapo.pt/v7" style="width: 100%; height: 100%;"></webview>
    <script src="renderer.js"></script>
</body>
</html>
